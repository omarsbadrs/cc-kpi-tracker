<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
  <!-- ELSEWEDY text -->
  <text x="10" y="45" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="38" fill="#e2e8f0" letter-spacing="3">ELSEWEDY</text>
  <!-- Double line -->
  <line x1="10" y1="52" x2="270" y2="52" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="10" y1="55" x2="270" y2="55" stroke="#e2e8f0" stroke-width="2.5"/>
  <!-- ELECTRIC text -->
  <text x="10" y="90" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="38" fill="#e2e8f0" letter-spacing="3">ELECTRIC</text>
  <!-- Red swoosh/smile -->
  <path d="M 40 100 Q 150 118 260 100" stroke="#DC2626" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Gray divider -->
  <line x1="290" y1="15" x2="290" y2="105" stroke="#9CA3AF" stroke-width="2"/>
  <!-- PSP in red -->
  <text x="310" y="80" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="52" fill="#DC2626" letter-spacing="2">PSP</text>
</svg>
