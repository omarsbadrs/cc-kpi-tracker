<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 235" fill="none" role="img" aria-label="Elsewedy Electric PSP">
  <!-- Wordmark: wide, light geometric caps. textLength pins each line to the
       same width whatever system font draws it. -->
  <g fill="#1d1d1b" font-family="Bahnschrift, Eurostile, Microgramma, 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="84">
    <text x="5" y="65" textLength="515" lengthAdjust="spacingAndGlyphs">ELSEWEDY</text>
    <text x="5" y="162" textLength="515" lengthAdjust="spacingAndGlyphs">ELECTRIC</text>
  </g>
  <!-- Rule between the two lines -->
  <rect x="5" y="80" width="515" height="6" fill="#1d1d1b"/>
  <!-- Red crescent under the wordmark -->
  <path d="M90 188 Q262 250 435 188 Q262 224 90 188 Z" fill="#ca2a30"/>
  <!-- Divider -->
  <rect x="593" y="10" width="5" height="155" fill="#8a8a8a"/>
  <!-- PSP -->
  <text x="653" y="110" textLength="177" lengthAdjust="spacingAndGlyphs" fill="#ca2a30" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="82">PSP</text>
</svg>
